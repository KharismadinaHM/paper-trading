name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: paper_trading_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d paper_trading_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/paper_trading_ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Migrations apply cleanly and match models
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head

      - name: Unit tests (SQLite, isolated)
        run: pytest -q

      - name: Concurrency test on PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/paper_trading_ci
        run: pytest -q tests/test_paper_account_db.py -k concurrent

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t paper-trading:ci .
      - name: Smoke test imports as non-root user
        run: docker run --rm paper-trading:ci python -c "import app.dashboard, app.market_collector.run, app.paper_trading.settlement_worker; import os; assert os.getuid() != 0"
