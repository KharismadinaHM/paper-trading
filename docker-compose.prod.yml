services:
  postgres:
    image: postgres:16-alpine
    container_name: paper_trading_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-paper_trading}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-paper_trading}"]
      interval: 5s
      timeout: 5s
      retries: 5

  dashboard:
    build: .
    container_name: paper_trading_dashboard
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8000:8000"
    command: uvicorn app.dashboard:app --host 0.0.0.0 --port 8000

  telegram_bot:
    build: .
    container_name: paper_trading_telegram_bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    command: python -m app.paper bot

volumes:
  postgres_data:
    driver: local
